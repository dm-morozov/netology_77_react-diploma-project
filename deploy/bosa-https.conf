limit_req_zone $binary_remote_addr zone=bosa_api:1m rate=10r/s;
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bosa-api.mu56.ru;
    ssl_certificate /etc/letsencrypt/live/bosa-api.mu56.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bosa-api.mu56.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    access_log off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    location /api/ {
        limit_req zone=bosa_api burst=20 nodelay;
        limit_req_status 429;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_pass http://127.0.0.1:18082;
    }
    location / { return 404; }
}
